name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps, build and test
        run: npm ci && npm run all
      - name: Check formatting left the tree clean
        uses: ./

      - name: Bump version and update changelog
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(npm version "${BUMP}" --no-git-tag-version)
          version="${version#v}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"

          # Turn the "## [Unreleased]" section into this release's section,
          # and save its body as the release notes
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            sed -i "s/^## \[Unreleased\].*/## [${version}], $(date -u +%F)/" CHANGELOG.md
            awk -v h="## [${version}]," 'index($0, h) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Version bump goes to main
          git commit -am "${TAG#v}"
          version_commit=$(git rev-parse HEAD)

          # The tags point at a commit on top of that which also contains dist/
          # (it is gitignored on main, but actions run it straight from the tag)
          git add -f dist
          git commit -m "Build ${TAG}"
          git tag "${TAG}"
          git tag -f "${MAJOR}"

          git push --atomic origin \
            "${version_commit}:refs/heads/main" \
            "refs/tags/${TAG}" \
            "+refs/tags/${MAJOR}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "${TAG}" --title "${TAG}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
